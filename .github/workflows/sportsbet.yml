# Unattended operation on the GitHub Actions free tier.
#
# `tick` runs hourly Wednesday through Monday (UTC). Each run decides for itself whether
# to spend Odds API credits (sportsbet/schedule.py: ~6 pulls a week, 3 credits each),
# pulls free injury data, and commits reports/latest.md back to this branch.
# The DuckDB history lives in actions/cache between runs, with a daily artifact backup
# that is restored automatically if the cache was evicted.
#
# `test` runs the unit tests on every push and pull request.

name: sportsbet

on:
  schedule:
    # minute 23 avoids the top-of-hour rush, when GitHub delays scheduled runs the most
    - cron: "23 * * * 0,1,3,4,5,6"
  workflow_dispatch:
    inputs:
      force_pull:
        description: "Pull odds now (3 credits) regardless of the schedule"
        type: boolean
        default: false
  push:
  pull_request:

permissions:
  contents: write
  actions: read # to find the backup artifact when the cache is gone

env:
  SPORTSBET_DATA_DIR: ${{ github.workspace }}/data
  NFLREADPY_CACHE: filesystem
  NFLREADPY_CACHE_DIR: ${{ github.workspace }}/data/cache/nflreadpy

jobs:
  tick:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: sportsbet-tick-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e .

      - name: Date stamps
        id: when
        run: |
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          echo "hour=$(date -u +%H)" >> "$GITHUB_OUTPUT"

      # Cache entries are immutable, so every run saves under a new key and restores the
      # newest entry through the stable prefix in restore-keys.
      - name: Restore DuckDB history
        id: db-cache
        uses: actions/cache/restore@v4
        with:
          path: data/sportsbet.duckdb
          key: sportsbet-db-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            sportsbet-db-v1-${{ github.ref_name }}-
            sportsbet-db-v1-

      - name: Restore DuckDB from backup artifact if the cache was evicted
        if: steps.db-cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=sportsbet-duckdb&per_page=20" \
                 --jq '[.artifacts[] | select(.expired | not)][0].id // empty')
          if [ -n "$id" ]; then
            mkdir -p data
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "${RUNNER_TEMP}/db.zip"
            unzip -o "${RUNNER_TEMP}/db.zip" -d data
            echo "restored DuckDB from backup artifact ${id}"
          else
            echo "no cache and no backup: starting a fresh history"
          fi

      # nflreadpy refreshes its own files after 24h, so one cache entry per day is enough.
      # The fitted push chart rides along; without it every tick with odds refits it.
      - name: Restore nflreadpy cache
        uses: actions/cache@v4
        with:
          path: |
            data/cache/nflreadpy
            data/cache/pushchart.json
          key: nflreadpy-${{ steps.when.outputs.day }}
          restore-keys: nflreadpy-

      - name: Run tick
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          FORCE_PULL: ${{ inputs.force_pull }}
        run: |
          args=()
          if [ "${FORCE_PULL}" = "true" ]; then args+=(--force-pull); fi
          python -m sportsbet run-tick "${args[@]}"

      - name: Save DuckDB history
        if: always() && hashFiles('data/sportsbet.duckdb') != ''
        uses: actions/cache/save@v4
        with:
          path: data/sportsbet.duckdb
          key: sportsbet-db-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      # actions/cache evicts entries unused for 7 days (or when the repo passes 10 GB),
      # so keep a dated copy once a day and on every manual run.
      - name: Back up DuckDB as an artifact
        if: always() && hashFiles('data/sportsbet.duckdb') != '' && (steps.when.outputs.hour == '12' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-artifact@v4
        with:
          name: sportsbet-duckdb
          path: data/sportsbet.duckdb
          retention-days: 30

      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # run-tick always writes one; if it did not, there is nothing to commit
          if [ ! -d reports ]; then echo "no reports directory"; exit 0; fi
          git add reports
          if git diff --cached --quiet; then
            echo "reports unchanged"
            exit 0
          fi
          git commit -m "Update sportsbet report [skip ci]"
          # a push to the branch during the run would reject ours; replay on top once
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload latest report
        if: always() && hashFiles('reports/latest.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sportsbet-report
          path: reports/latest.md
          retention-days: 7

  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      # "not network" deselects live-data tests if any are marked; otherwise it runs everything
      - name: Test
        run: python -m pytest -q -m "not network"
